<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Настройки — контуры</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&amp;family=Unbounded:wght@600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Golos Text',system-ui,sans-serif;background:#F3F3F7;color:#1B2050;-webkit-font-smoothing:antialiased}
a{color:#3F4AA8;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
/* Карточка контура: белая, рамка #DEDEE8, r 18, высота 76, отступы 0 8 0 14 */
.c{min-height:76px;box-sizing:border-box;background:#FFFFFF;border:1px solid #DEDEE8;border-radius:18px;padding:0 8px 0 10px;display:flex;align-items:center;gap:12px;color:#1B2050}
.tile{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.n{font-size:16px;font-weight:600}
.m{display:block;margin-top:3px;font-size:12.5px;font-weight:500;color:#61637E}
.badge{height:22px;padding:0 8px;border-radius:11px;background:#E6E8F7;color:#2C3480;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;margin-left:8px;vertical-align:2px}
</style>
<style>
html,body{background:#E7E7ED}
body{display:flex;align-items:flex-start;justify-content:center;padding:0}
</style>
</head>
<body>
<!-- 390×844. Настройки → Цели → Контуры. «Работа» сейчас активна (по расписанию), первая — по умолчанию. -->
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F3F7; display: flex; flex-direction: column; overflow: hidden;">

  <header style="padding: 10px 8px 10px 4px; display: flex; align-items: center; gap: 4px; background: #FFFFFF; border-bottom: 1px solid #DEDEE8;">
    <a href="#" aria-label="Назад" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1B2050;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <div style="flex-grow: 1; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 18px;">Контуры</div>
  </header>

  <div style="flex-grow: 1; padding: 0 16px; overflow: hidden;">
    <p style="margin: 14px 4px 14px; font-size: 14px; font-weight: 500; line-height: 1.45; color: #61637E;">Контур — свой набор слотов для целей и свой набор задач в работе. Активный выбирается по расписанию; первый в списке — по умолчанию.</p>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <a href="Contour-Edit.html" class="c">
        <svg width="14" height="20" viewBox="0 0 14 20" aria-hidden="true" style="flex-shrink: 0;"><g fill="#C3C6DE"><circle cx="4" cy="4" r="1.6"/><circle cx="10" cy="4" r="1.6"/><circle cx="4" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="4" cy="16" r="1.6"/><circle cx="10" cy="16" r="1.6"/></g></svg>
        <span class="tile" style="background: #14183C;"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.5l4.6 3.6L12 5l4.4 7.1L21 8.5l-1.8 9.5H4.8z" fill="#FFC94D"/><path d="M5 21h14" stroke="#FFC94D" stroke-width="2" stroke-linecap="round"/></svg></span>
        <span style="flex-grow: 1; min-width: 0;">
          <span class="n">Работа</span><span class="badge">сейчас</span>
          <span class="m">2 слота · окно 7 д · пн–пт 9:00–19:00</span>
          <span style="display: block; margin-top: 2px; font-size: 11.5px; font-weight: 600; color: #61637E;">по умолчанию</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#61637E" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </a>
      <a href="Contour-Edit.html" class="c">
        <svg width="14" height="20" viewBox="0 0 14 20" aria-hidden="true" style="flex-shrink: 0;"><g fill="#C3C6DE"><circle cx="4" cy="4" r="1.6"/><circle cx="10" cy="4" r="1.6"/><circle cx="4" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="4" cy="16" r="1.6"/><circle cx="10" cy="16" r="1.6"/></g></svg>
        <span class="tile" style="background: #E6E8F7;"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.5l4.6 3.6L12 5l4.4 7.1L21 8.5l-1.8 9.5H4.8z" fill="#8C91B8"/><path d="M5 21h14" stroke="#8C91B8" stroke-width="2" stroke-linecap="round"/></svg></span>
        <span style="flex-grow: 1; min-width: 0;">
          <span class="n">Личное</span>
          <span class="m">2 слота · окно 14 д · без расписания</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#61637E" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </div>
  </div>

  <div style="padding: 12px 16px 16px;">
    <a href="Contour-Edit.html" style="height: 56px; border-radius: 18px; background: #1B2050; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Контур
    </a>
  </div>
</div>
</body>
</html>
