<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Работа — три задачи в фокусе</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&amp;family=Unbounded:wght@600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Golos Text',system-ui,sans-serif;background:#F3F3F7;color:#1B2050;-webkit-font-smoothing:antialiased}
a{color:#3F4AA8;text-decoration:none}a:hover{color:#2C3480}
button{font:inherit;color:inherit;cursor:pointer}
</style>
<style>
html,body{background:#E7E7ED}
body{display:flex;align-items:flex-start;justify-content:center;padding:0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F3F7; display: flex; flex-direction: column; overflow: hidden;">

  <header style="padding: 18px 16px 10px; display: flex; align-items: center; gap: 12px;">
    <span style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 21px; letter-spacing: -0.01em;">Работа</span>
    <span style="display: inline-flex; align-items: center; gap: 6px;">
      <span style="width: 11px; height: 11px; border-radius: 50%; background: #1B2050;"></span>
      <span style="width: 11px; height: 11px; border-radius: 50%; background: #C3C6DE;"></span>
      <span style="width: 11px; height: 11px; border-radius: 50%; background: #C3C6DE;"></span>
    </span>
    <span style="flex-grow: 1;"></span>
    <a href="Pick.dc.html" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #C3C6DE; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #3A3C5C;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h11M4 17h7"/></svg>Набор
    </a>
  </header>

  <section style="margin: 6px 16px 0; background: #FFFFFF; border: 1px solid #DEDEE8; border-radius: 26px; padding: 20px 18px 18px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="height: 28px; padding: 0 12px; border-radius: 14px; background: #E6E8F7; color: #2C3480; display: inline-flex; align-items: center; font-size: 13px; font-weight: 700;">Дом</span>
      <span style="flex-grow: 1;"></span>
      <span style="font-size: 12.5px; font-weight: 600; color: #61637E;">в работе с 9:40</span>
    </div>

    <h1 style="margin: 16px 0 0; font-size: 27px; font-weight: 600; line-height: 1.28; letter-spacing: -0.01em;">Вызвать курьера из Яндекс Маркета.</h1>

    <button style="margin-top: 22px; width: 100%; height: 68px; border: none; border-radius: 22px; background: #2A6B4E; color: #FFFFFF; font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
      Сделано
    </button>

    <div style="margin-top: 10px; display: flex; gap: 10px;">
      <button style="flex-grow: 1; height: 52px; border-radius: 18px; border: 1px solid #EBD5B0; background: #FDF7EE; color: #8A5A0B; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/></svg>Блокер
      </button>
      <a href="Edit.dc.html" style="flex-grow: 1; height: 52px; border-radius: 18px; border: 1px solid #DEDEE8; background: #FFFFFF; color: #3A3C5C; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M4 20h4l10-10-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>Правка
      </a>
    </div>
  </section>

  <div style="margin: 20px 16px 0; display: flex; align-items: center; gap: 8px;">
    <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: #61637E;">Дальше</span>
    <span style="flex-grow: 1; height: 1px; background: #DEDEE8;"></span>
  </div>

  <button style="margin: 10px 16px 0; text-align: left; background: #FFFFFF; border: 1px solid #DEDEE8; border-radius: 18px; padding: 14px; display: flex; align-items: center; gap: 12px;">
    <span style="width: 26px; height: 26px; border-radius: 13px; border: 2px solid #C3C6DE; flex-shrink: 0;"></span>
    <span style="flex-grow: 1;">
      <span style="display: block; font-size: 16px; font-weight: 500; line-height: 1.32;">Потестить диктовку на телефоне</span>
      <span style="display: block; margin-top: 5px; font-size: 12px; font-weight: 600; color: #61637E;">TaskRadar</span>
    </span>
  </button>

  <button style="margin: 10px 16px 0; text-align: left; background: #FFFFFF; border: 1px solid #DEDEE8; border-radius: 18px; padding: 14px; display: flex; align-items: center; gap: 12px;">
    <span style="width: 26px; height: 26px; border-radius: 13px; border: 2px solid #C3C6DE; flex-shrink: 0;"></span>
    <span style="flex-grow: 1;">
      <span style="display: block; font-size: 16px; font-weight: 500; line-height: 1.32;">Адаптировать кнопку распознавания, размер шрифта, взаимное расположение</span>
      <span style="display: block; margin-top: 5px; font-size: 12px; font-weight: 600; color: #61637E;">TaskRadar</span>
    </span>
  </button>

  <div style="flex-grow: 1;"></div>

  <nav style="height: 82px; box-sizing: border-box; border-top: 1px solid #DEDEE8; background: #FFFFFF; display: flex; align-items: flex-start; padding: 8px 10px 0; gap: 6px;">
    <a href="Main.dc.html" style="flex-grow: 1; height: 54px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #61637E;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 12V3"/></svg>
      <span style="font-size: 11px; font-weight: 600;">План</span>
    </a>
    <a href="Focus.dc.html" style="flex-grow: 1; height: 54px; border-radius: 16px; background: #E6E8F7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #2C3480;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
      <span style="font-size: 11px; font-weight: 700;">Работа</span>
    </a>
    <a href="History.dc.html" style="flex-grow: 1; height: 54px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #61637E;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M3 20h18"/><path d="M6 20v-6M11 20V8M16 20v-9M21 20V5"/></svg>
      <span style="font-size: 11px; font-weight: 600;">История</span>
    </a>
    <a href="Dictate.dc.html" style="width: 84px; flex-shrink: 0; height: 54px; border-radius: 16px; background: #4A56BE; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
      <span style="font-size: 11px; font-weight: 700;">Голос</span>
    </a>
  </nav>
</div>
</body>
</html>
