<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Десктоп — работа</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&amp;family=Unbounded:wght@600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Golos Text',system-ui,sans-serif;background:#F3F3F7;color:#1B2050;-webkit-font-smoothing:antialiased}
a{color:#3F4AA8;text-decoration:none}a:hover{color:#2C3480}
button{font:inherit;color:inherit;cursor:pointer}
</style>
<style>
html,body{background:#E7E7ED}
body{display:flex;align-items:flex-start;justify-content:center;padding:0}
</style>
</head>
<body>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F3F3F7; display: flex; overflow: hidden;">

  <nav style="width: 76px; flex-shrink: 0; background: #1B2050; display: flex; flex-direction: column; align-items: center; padding: 18px 0 16px; gap: 10px;">
    <span style="width: 34px; height: 34px; border-radius: 10px; background: #4A56BE; display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D6DBFF" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.2"/><circle cx="15.6" cy="8.4" r="1.6" fill="#F0A33C" stroke="none"/></svg>
    </span>
    <a href="Desk-Plan.dc.html" style="width: 56px; height: 56px; border-radius: 18px; color: #A7AECF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 12V3"/></svg>
      <span style="font-size: 9.5px; font-weight: 600;">План</span>
    </a>
    <a href="Desk-Focus.dc.html" style="width: 56px; height: 56px; border-radius: 18px; background: #333A73; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
      <span style="font-size: 9.5px; font-weight: 700;">Работа</span>
    </a>
    <a href="Desk-History.dc.html" style="width: 56px; height: 56px; border-radius: 18px; color: #A7AECF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M3 20h18"/><path d="M6 20v-6M11 20V8M16 20v-9M21 20V5"/></svg>
      <span style="font-size: 9.5px; font-weight: 600;">Итоги</span>
    </a>
    <span style="flex-grow: 1;"></span>
    <button style="width: 56px; height: 56px; border-radius: 18px; border: none; background: #4A56BE; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
      <span style="font-size: 9.5px; font-weight: 700;">Голос</span>
    </button>
    <button aria-label="Настройки" style="width: 48px; height: 48px; border: none; background: transparent; color: #A7AECF; display: flex; align-items: center; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/></svg>
    </button>
  </nav>

  <div style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden;">

    <header style="height: 78px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; gap: 16px; background: #FFFFFF; border-bottom: 1px solid #DEDEE8;">
      <span style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.01em;">Работа</span>
      <span style="display: inline-flex; align-items: center; gap: 7px;">
        <span style="width: 12px; height: 12px; border-radius: 50%; background: #1B2050;"></span>
        <span style="width: 12px; height: 12px; border-radius: 50%; background: #C3C6DE;"></span>
        <span style="width: 12px; height: 12px; border-radius: 50%; background: #C3C6DE;"></span>
      </span>
      <span style="flex-grow: 1;"></span>
      <a href="Desk-Plan.dc.html" style="height: 44px; padding: 0 18px; border-radius: 16px; border: 1px solid #C3C6DE; display: inline-flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; color: #3A3C5C;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h11M4 17h7"/></svg>Пересобрать набор
      </a>
    </header>

    <div style="flex-grow: 1; padding: 40px 40px 32px; display: flex; gap: 28px; overflow: hidden;">

      <section style="flex-grow: 1; background: #FFFFFF; border: 1px solid #DEDEE8; border-radius: 28px; padding: 44px 48px 40px; display: flex; flex-direction: column;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="height: 32px; padding: 0 14px; border-radius: 16px; background: #E6E8F7; color: #2C3480; display: inline-flex; align-items: center; font-size: 14px; font-weight: 700;">Дом</span>
          <span style="font-size: 13.5px; font-weight: 600; color: #61637E;">в работе с 9:40 · сегодня третья</span>
        </div>

        <h1 style="margin: 28px 0 0; font-size: 46px; font-weight: 600; line-height: 1.2; letter-spacing: -0.015em; max-width: 620px;">Вызвать курьера из Яндекс Маркета.</h1>

        <span style="flex-grow: 1;"></span>

        <div style="display: flex; gap: 14px; align-items: center;">
          <button style="height: 76px; padding: 0 40px; border: none; border-radius: 24px; background: #2A6B4E; color: #FFFFFF; font-size: 20px; font-weight: 700; display: inline-flex; align-items: center; gap: 12px;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Сделано
          </button>
          <button style="height: 76px; padding: 0 26px; border-radius: 24px; border: 1px solid #EBD5B0; background: #FDF7EE; color: #8A5A0B; font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; gap: 10px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/></svg>Блокер
          </button>
          <button style="height: 76px; padding: 0 26px; border-radius: 24px; border: 1px solid #DEDEE8; background: #FFFFFF; color: #3A3C5C; font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; gap: 10px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M4 20h4l10-10-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>Правка
          </button>
          <span style="flex-grow: 1;"></span>
          <span style="font-size: 13px; font-weight: 600; color: #61637E;">пробел — сделано · B — блокер</span>
        </div>
      </section>

      <aside style="width: 360px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px;">
        <div style="font-size: 12.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #61637E; padding-left: 4px;">Дальше в наборе</div>

        <button style="text-align: left; background: #FFFFFF; border: 1px solid #DEDEE8; border-radius: 20px; padding: 18px; display: flex; gap: 14px; align-items: flex-start;">
          <span style="width: 26px; height: 26px; border-radius: 13px; border: 2px solid #C3C6DE; flex-shrink: 0; margin-top: 2px;"></span>
          <span style="flex-grow: 1;">
            <span style="display: block; font-size: 16.5px; font-weight: 500; line-height: 1.32;">Потестить диктовку на телефоне</span>
            <span style="display: block; margin-top: 8px; font-size: 12.5px; font-weight: 600; color: #61637E;">TaskRadar · лежит 5 д</span>
          </span>
        </button>

        <button style="text-align: left; background: #FFFFFF; border: 1px solid #DEDEE8; border-radius: 20px; padding: 18px; display: flex; gap: 14px; align-items: flex-start;">
          <span style="width: 26px; height: 26px; border-radius: 13px; border: 2px solid #C3C6DE; flex-shrink: 0; margin-top: 2px;"></span>
          <span style="flex-grow: 1;">
            <span style="display: block; font-size: 16.5px; font-weight: 500; line-height: 1.32;">Адаптировать кнопку распознавания, размер шрифта, окно, взаимное расположение</span>
            <span style="display: block; margin-top: 8px; font-size: 12.5px; font-weight: 600; color: #61637E;">TaskRadar · лежит 4 д</span>
          </span>
        </button>

        <div style="background: #FFFFFF; border: 1px solid #DEDEE8; border-radius: 20px; padding: 18px;">
          <div style="font-size: 12.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #61637E;">Заметки · Дом</div>
          <div style="margin-top: 10px; font-size: 14.5px; font-weight: 500; color: #3A3C5C; line-height: 1.4;">пусто — заметки проекта откроются здесь, когда они есть</div>
        </div>

        <span style="flex-grow: 1;"></span>

        <div style="background: #FFFFFF; border: 1px solid #DEDEE8; border-radius: 20px; padding: 18px; display: flex; align-items: center; gap: 14px;">
          <span style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 30px; color: #2A6B4E;">2</span>
          <span style="font-size: 14px; font-weight: 500; color: #3A3C5C; line-height: 1.35;">закрыто сегодня</span>
        </div>
      </aside>
    </div>
  </div>
</div>
</body>
</html>
