<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Задача крупно — правка и история</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&amp;family=Unbounded:wght@600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Golos Text',system-ui,sans-serif;background:#F3F3F7;color:#1B2050;-webkit-font-smoothing:antialiased}
a{color:#3F4AA8;text-decoration:none}a:hover{color:#2C3480}
button{font:inherit;color:inherit;cursor:pointer}
textarea{font:inherit;color:inherit}
</style>
<style>
html,body{background:#E7E7ED}
body{display:flex;align-items:flex-start;justify-content:center;padding:0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F3F7; display: flex; flex-direction: column; overflow: hidden;">

  <header style="padding: 10px 12px 10px 4px; display: flex; align-items: center; gap: 8px;">
    <a href="Project.dc.html" aria-label="Закрыть" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1B2050;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <span style="flex-grow: 1; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 16px;">Задача</span>
    <a href="Project.dc.html" style="height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 16px; background: #E6E8F7; color: #2C3480; font-size: 13px; font-weight: 600;">Дом
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </a>
    <button aria-label="Удалить задачу" style="width: 44px; height: 44px; border: none; background: transparent; color: #61637E; display: flex; align-items: center; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"/></svg>
    </button>
  </header>

  <label for="task-text" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Текст задачи</label>
  <textarea id="task-text" style="margin: 0 16px; height: 252px; box-sizing: border-box; background: #FFFFFF; border: 1.5px solid #3F4AA8; border-radius: 20px; padding: 16px; font-size: 20px; font-weight: 500; line-height: 1.42; resize: none; outline: none;">Посмотреть, почему не работает вентилятор в туалете. Позвонить в УК и спросить, чей это участок.</textarea>

  <div style="margin: 16px 16px 0; display: flex; gap: 8px;">
    <button style="flex-grow: 1; height: 54px; border-radius: 16px; border: 1px solid #DEDEE8; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #61637E;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="12" r="9"/></svg>
      <span style="font-size: 12px; font-weight: 600;">В очереди</span>
    </button>
    <button aria-pressed="true" style="flex-grow: 1; height: 54px; border-radius: 16px; border: 1.5px solid #E0A03C; background: #FDF7EE; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #8A5A0B;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/></svg>
      <span style="font-size: 12px; font-weight: 700;">Блокер</span>
    </button>
    <button style="flex-grow: 1; height: 54px; border-radius: 16px; border: 1px solid #DEDEE8; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #61637E;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.2l2.6 2.6L16 9.4"/></svg>
      <span style="font-size: 12px; font-weight: 600;">Сделано</span>
    </button>
  </div>

  <button style="margin: 8px 16px 0; height: 52px; border-radius: 16px; border: 1px solid #EBD5B0; background: #FDF7EE; display: flex; align-items: center; gap: 10px; padding: 0 14px; color: #8A5A0B;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7z"/><path d="M10.5 20h3"/></svg>
    <span style="flex-grow: 1; text-align: left; font-size: 15px; font-weight: 600;">Напомнить 23 сентября</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </button>

  <section style="margin: 16px 16px 0; background: #FFFFFF; border: 1px solid #DEDEE8; border-radius: 18px; padding: 14px;">
    <div style="display: flex; align-items: baseline; gap: 8px;">
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; color: #61637E;">Жизнь задачи</span>
      <span style="flex-grow: 1;"></span>
      <span style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 17px;">8 дней</span>
    </div>

    <div style="margin-top: 12px; display: flex; height: 16px; border-radius: 8px; overflow: hidden;">
      <span style="width: 50%; background: #C3C6DE;"></span>
      <span style="width: 12.5%; background: #3F4AA8;"></span>
      <span style="width: 37.5%; background: #E0A03C;"></span>
    </div>

    <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 9px;">
      <div style="display: flex; align-items: center; gap: 9px;">
        <span style="width: 11px; height: 11px; border-radius: 3px; background: #C3C6DE;"></span>
        <span style="flex-grow: 1; font-size: 13.5px; font-weight: 500; color: #3A3C5C;">лежала в очереди</span>
        <span style="font-size: 13px; font-weight: 700; color: #1B2050;">4 д</span>
      </div>
      <div style="display: flex; align-items: center; gap: 9px;">
        <span style="width: 11px; height: 11px; border-radius: 3px; background: #3F4AA8;"></span>
        <span style="flex-grow: 1; font-size: 13.5px; font-weight: 500; color: #3A3C5C;">была в работе</span>
        <span style="font-size: 13px; font-weight: 700; color: #1B2050;">1 д</span>
      </div>
      <div style="display: flex; align-items: center; gap: 9px;">
        <span style="width: 11px; height: 11px; border-radius: 3px; background: #E0A03C;"></span>
        <span style="flex-grow: 1; font-size: 13.5px; font-weight: 500; color: #3A3C5C;">ждёт с 18.09</span>
        <span style="font-size: 13px; font-weight: 700; color: #8A5A0B;">3 д</span>
      </div>
    </div>
  </section>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 12px 16px 18px; display: flex; gap: 10px;">
    <button style="flex-grow: 1; height: 56px; border: none; border-radius: 18px; background: #1B2050; color: #FFFFFF; font-size: 16px; font-weight: 600;">Сохранить</button>
    <a href="Dictate.dc.html" aria-label="Дописать голосом" style="width: 56px; height: 56px; border-radius: 18px; background: #4A56BE; color: #FFFFFF; display: flex; align-items: center; justify-content: center;">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
    </a>
  </div>
</div>
</body>
</html>
