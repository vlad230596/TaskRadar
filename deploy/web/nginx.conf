# Server block for the TaskRadar web client image (`taskradar-web`).
#
# It serves the output of `flutter build web` and does nothing else: no
# compression (the shared Caddy already does `encode zstd gzip` at the edge, and
# compressing twice only costs CPU), no TLS (the edge terminates it), no
# security headers (they belong to the origin, which is Caddy's site block --
# see deploy/Caddyfile.taskradar.example).
#
# The same file is used by the CI stack (deploy/compose.ci.yaml mounts it over a
# stock nginx image), so a mistake here shows up as a failing integration check
# rather than as a blank page after a release.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    # "nginx" instead of "nginx/1.29.x". The edge strips the header entirely;
    # this is the belt to that pair of braces.
    server_tokens off;

    # The one document this server serves. Spelled as its own exact-match
    # location, rather than left to the `index` directive, so that the root and
    # every other path are answered by rules that say plainly what they do --
    # and so that nothing here depends on how try_files treats a directory.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    # No SPA fallback, and that is deliberate rather than an omission.
    #
    # Flutter's default URL strategy keeps routes in the fragment (`/#/board`),
    # which the browser never sends to a server. So every path that does reach
    # nginx is a request for a real file, and `try_files $uri =404` is not just
    # sufficient but better than `try_files $uri /index.html`: the fallback
    # would answer 200 and an HTML document to a mistyped asset path, turning a
    # missing file into a parse error inside the engine, and it would quietly
    # take over the "unrouted paths are refused" property that the edge's
    # allowlist is there to give.
    #
    # If this app ever calls `usePathUrlStrategy()`, this line has to become a
    # fallback to /index.html *and* the edge's allowlist has to be re-read: API
    # prefixes and app routes would then share one namespace.
    #
    # A directory (`/assets`, `/canvaskit`) is not a regular file, so it falls
    # through to the 404 as well -- there is no listing here and nothing to
    # index.
    location / {
        try_files $uri =404;

        # Revalidate everything, always.
        #
        # `flutter build web` does not content-hash its output: `main.dart.js`,
        # `flutter_bootstrap.js` and `assets/...` keep their names across
        # releases, so a cached copy is indistinguishable from the current one
        # by URL alone. With `no-cache` the browser still holds the bytes but
        # asks first, and an unchanged file costs a 304 instead of a download.
        # `immutable` caching would be the right answer for hashed filenames and
        # the wrong one here -- it would serve last release's engine against this
        # release's API for as long as the max-age lasted.
        add_header Cache-Control "no-cache" always;
    }
}
