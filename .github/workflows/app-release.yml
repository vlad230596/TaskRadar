name: Release TaskRadar native clients

# Packages the native clients -- the Android APK and the Windows zip -- and
# attaches them to the GitHub Release for an existing tag.
#
# The web client is not here: it is served by the production origin, so it is
# built and deployed by release.yml together with the API. These two are
# downloads, and a download can lag a release without anything breaking.
#
# Why they live in a GitHub Release rather than on the VDS: the clients are
# installed by hand onto one phone and one desktop (TaskRadar will never be
# published to Play, see flutter-migration-plan.md). A Release gives a private,
# authenticated, versioned download with a checksum and a build attestation, and
# it keeps the TaskRadar origin serving only the API and the web bundle --
# hosting a signed binary next to the data would buy nothing.
#
# Version input, not a build from main: both artifacts are built from an
# existing release tag, so "which code is on the phone" has the same answer as
# "which code is on the server".
#
# Separate from release.yml on purpose: the backend must be deployable without
# waiting for a native client build, and a native client build must not be able
# to block a server fix.
#
# Signing: `app/android/app/build.gradle.kts` reads the release key from
# `android/key.properties` or from TASKRADAR_ANDROID_* environment variables, and
# refuses to build a release without one. This job supplies the environment half
# from the four Actions secrets below. The owner has to create the keystore and
# store the secrets once -- `app/RELEASE-ANDROID.md` says how, and why that key
# can never be lost or replaced.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing SemVer tag to build the APK from
        required: true
        type: string
      flutter_version:
        # Pinned rather than "latest stable" by default: a release APK should be
        # built by the toolchain the app is actually developed against, and a
        # Flutter release landing between two builds must not be able to change
        # what ships to the phone. Override it deliberately when moving the pin.
        description: Exact Flutter version to build with (empty = latest stable)
        required: false
        type: string
        default: '3.41.8'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      # The origin the APK talks to, baked in at build time (AppConfig.apiBaseUrl)
      # -- an APK cannot be repointed afterwards. `TASKRADAR_API_URL` is set as a
      # repository variable; `PRODUCTION_URL` is the fallback because it is the
      # same origin (it is what the deploy job publishes as the production
      # environment URL) and having the APK job fail on a variable nobody
      # remembers setting is a worse failure than reusing the one that must
      # exist anyway.
      TASKRADAR_API_URL: ${{ vars.TASKRADAR_API_URL || vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.version }}

      - name: Require a real release signing config
        # Regression guard, and it fails before the three minutes of SDK setup.
        #
        # The release build type used to be signed with the *debug* keystore
        # ("TODO: Add your own signing config"). A debug-signed APK installs and
        # runs, so nothing would look wrong -- until the debug keystore is
        # regenerated (a fresh checkout, another machine, a reinstalled SDK), at
        # which point Android refuses to update the installed app and the only
        # way forward is uninstalling it and losing its local state. Worse, the
        # debug key is not a secret, so anyone could sign an update for this
        # application id. Attaching such an APK to a Release would make all of
        # that durable, so this step exists to make sure that line never comes
        # back. (Gradle now refuses an unsigned release build on its own; this is
        # the cheap early check, not the real one.)
        #
        # It matches the **assignment**, not the string. The first version of
        # this step grepped the whole file for `signingConfigs.getByName("debug")`
        # and failed on its first real run -- on the comment in build.gradle.kts
        # that explains what the line used to say. A guard that cannot tell code
        # from the comment describing the bug it guards against is a guard that
        # blocks every release; `^[^*/]*` drops the comment lines, which in that
        # file all start with `*` or `//`.
        run: |
          gradle_file=app/android/app/build.gradle.kts
          assignment='signingConfig[[:space:]]*=[[:space:]]*signingConfigs\.getByName'

          if grep -qE "^[^*/]*${assignment}\(\"debug\"\)" "$gradle_file"; then
            echo "$gradle_file signs the release build with the debug keystore." >&2
            echo 'It must use the "release" signingConfig, which reads:' >&2
            echo '  TASKRADAR_ANDROID_KEYSTORE_PATH' >&2
            echo '  TASKRADAR_ANDROID_KEYSTORE_PASSWORD' >&2
            echo '  TASKRADAR_ANDROID_KEY_ALIAS' >&2
            echo '  TASKRADAR_ANDROID_KEY_PASSWORD' >&2
            exit 65
          fi

          # And the positive half: "no debug config" is also true of a file that
          # lost its signing config altogether.
          if ! grep -qE "^[^*/]*${assignment}\(\"release\"\)" "$gradle_file"; then
            echo "$gradle_file does not sign the release build with the release key." >&2
            exit 65
          fi

          test -n "$TASKRADAR_API_URL"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          cache: true

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # All four are checked here rather than left to the build: a missing
        # password surfaces from keytool as "keystore was tampered with, or
        # password was incorrect", which sends the reader hunting for a corrupt
        # keystore instead of an empty secret. The names are the ones in
        # app/RELEASE-ANDROID.md; `secrets.` names and the TASKRADAR_ANDROID_*
        # variable names below are deliberately distinct -- the former are what
        # GitHub stores, the latter are what build.gradle.kts reads.
        run: |
          for secret in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "Actions secret $secret is not set; see app/RELEASE-ANDROID.md." >&2
              exit 65
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/android/app/release-keystore.jks
          chmod 600 app/android/app/release-keystore.jks

      - name: Build the signed release APK
        working-directory: app
        env:
          TASKRADAR_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/app/android/app/release-keystore.jks
          TASKRADAR_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TASKRADAR_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TASKRADAR_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # The API URL is passed explicitly: AppConfig's default is
        # http://localhost:3001, which is correct for desktop development and
        # useless on a phone. A release build must also never fall back to
        # cleartext -- usesCleartextTraffic is enabled in the debug manifest
        # only, so an http:// value here produces an APK whose every request
        # fails with an opaque socket error.
        run: |
          case "$TASKRADAR_API_URL" in
            https://*) ;;
            *) echo 'TASKRADAR_API_URL must be an https:// origin.' >&2; exit 64 ;;
          esac
          flutter pub get
          flutter build apk --release \
            --build-name "$VERSION" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define="TASKRADAR_API_URL=$TASKRADAR_API_URL"
          mv build/app/outputs/flutter-apk/app-release.apk "../taskradar-$VERSION.apk"
          cd ..
          sha256sum "taskradar-$VERSION.apk" > "taskradar-$VERSION.apk.sha256"

      - name: Attest the APK
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: taskradar-${{ inputs.version }}.apk

      - name: Publish the APK to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" \
              "taskradar-$VERSION.apk" \
              "taskradar-$VERSION.apk.sha256" \
              --clobber
          else
            # --verify-tag: refuse to invent a tag here. Tags are created only by
            # the approved backend release workflow.
            gh release create "$VERSION" \
              "taskradar-$VERSION.apk" \
              "taskradar-$VERSION.apk.sha256" \
              --verify-tag \
              --title "TaskRadar $VERSION" \
              --generate-notes
          fi

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      TASKRADAR_API_URL: ${{ vars.TASKRADAR_API_URL || vars.PRODUCTION_URL }}
    # Independent of the APK job on purpose, and not because they are unrelated:
    # they are the same app. The Android half is blocked whenever the release
    # keystore is missing or wrong (app/RELEASE-ANDROID.md), and a desktop build
    # that cannot be published because of a key it does not use would be the
    # wrong kind of coupling. Both attach to the same Release, whichever gets
    # there first creates it.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.version }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          cache: true

      - name: Build the desktop client
        working-directory: app
        shell: bash
        # https:// is required for the same reason as in the APK job, minus the
        # cleartext-manifest part: a desktop build against http:// would work on
        # a LAN and send the session token in the clear, and a release artifact
        # is not the place to make that possible by accident.
        run: |
          case "$TASKRADAR_API_URL" in
            https://*) ;;
            *) echo 'TASKRADAR_API_URL must be an https:// origin.' >&2; exit 64 ;;
          esac
          flutter pub get
          flutter build windows --release \
            --build-name "$VERSION" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define="TASKRADAR_API_URL=$TASKRADAR_API_URL"

      - name: Package the installable zip
        shell: pwsh
        # The zip holds the build *and* install-windows-app.ps1: without the
        # shortcut that script creates, Windows drops every notification this
        # app posts, silently. See scripts/package-windows-app.ps1.
        run: ./scripts/package-windows-app.ps1 -Version "$env:VERSION" -OutputDirectory dist

      - name: Attest the zip
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/taskradar-${{ inputs.version }}-windows-x64.zip

      - name: Publish the zip to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zip="dist/taskradar-$VERSION-windows-x64.zip"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$zip" "$zip.sha256" --clobber
          else
            # --verify-tag, as in the APK job: tags are created only by the
            # approved release workflow, never here.
            gh release create "$VERSION" "$zip" "$zip.sha256" \
              --verify-tag \
              --title "TaskRadar $VERSION" \
              --generate-notes
          fi
