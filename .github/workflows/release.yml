name: Release TaskRadar backend

# Manual, approved, backend-only release.
#
# The Android client is packaged by a separate workflow (app-release.yml): the
# server and the phone are deployed on different rhythms, and an unsigned or
# unsignable APK must not be able to block a backend fix.

on:
  workflow_dispatch:
    inputs:
      version:
        description: New SemVer version to approve, tag, and deploy from main
        required: true
        type: string

concurrency:
  group: taskradar-production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      ref: ${{ steps.release.outputs.ref }}
      build_date: ${{ steps.release.outputs.build_date }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Validate release input
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Release workflow must be started from main.' >&2
            exit 64
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tag must be a SemVer core such as 1.0.0.' >&2
            exit 64
          fi
          # "latest" and friends are excluded by the pattern above on purpose:
          # the deploy script only accepts a digest, and a moving tag would make
          # "which code is running" unanswerable.
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists." >&2
            exit 65
          fi
          sha="$(git rev-parse HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  quality:
    needs: prepare
    # Re-runs every check against the exact commit being released, rather than
    # trusting the status of whatever ran on the branch earlier.
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  approve:
    needs: [prepare, quality]
    runs-on: ubuntu-latest
    # Protected Environment with the owner as required reviewer: the tag only
    # comes into existence after a human says yes, so an accidental dispatch
    # leaves no trace in the repository.
    environment:
      name: release-approval
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Create approved release tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION was created while approval was pending." >&2
            exit 65
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --annotate "$VERSION" "$RELEASE_SHA" --message "TaskRadar $VERSION"
          git push origin "refs/tags/$VERSION"

  publish:
    needs: [prepare, approve]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      backend_digest: ${{ steps.backend.outputs.digest }}
    env:
      IMAGE_NAMESPACE: ${{ github.repository_owner }}
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the backend image
        id: backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          # The VDS is amd64; building the other architectures would only slow
          # the release down.
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ env.VERSION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/taskradar-backend:${{ env.VERSION }}
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/taskradar-backend:sha-${{ github.sha }}
          # org.opencontainers.image.version is not decoration: the deploy script
          # reads it back from the pulled image and refuses to continue when it
          # does not match the release being deployed. It is the only identity
          # check available, since this backend exposes no /version route.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
      - name: Attest the backend image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ env.IMAGE_NAMESPACE }}/taskradar-backend
          subject-digest: ${{ steps.backend.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # Digest, never a tag: this is what the deploy script validates and what
      # makes the deployed artifact immutable.
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/taskradar-backend@${{ needs.publish.outputs.backend_digest }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
    steps:
      - name: Configure production SSH key
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/taskradar-production
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/taskradar-production ~/.ssh/known_hosts
      - name: Deploy the approved image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The registry token goes over stdin rather than in the command line:
        # arguments are readable by any process on the VDS through /proc.
        # StrictHostKeyChecking=yes turns an unexpected host key into a failed
        # deploy instead of a prompt nobody is there to answer.
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh \
            -i ~/.ssh/taskradar-production \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/taskradar-deploy '$VERSION' '$BACKEND_IMAGE' '${{ github.actor }}'"
