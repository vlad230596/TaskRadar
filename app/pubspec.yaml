name: taskradar
description: "TaskRadar native client (Android + Windows)."
# Personal tool, never published to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management. See flutter-migration-plan.md: async providers with caching
  # and invalidation match "server data + point mutations + refetch" directly.
  #
  # The three riverpod lines are pinned to exact versions, not `^`, and that is
  # load-bearing rather than cautious. The runtime, the annotations and the code
  # generator are released in lockstep with `==` constraints between them, so
  # there is exactly one self-consistent triple reachable from this SDK:
  #
  #   flutter_riverpod 3.2.1 -> riverpod 3.2.1
  #   riverpod_annotation 4.0.2 -> riverpod 3.2.1
  #   riverpod_generator 4.0.3 -> riverpod_annotation 4.0.2
  #
  # Everything newer needs Dart >=3.12 (we are on 3.11.5), or drags in
  # analyzer ^12 / meta ^1.18 while the Flutter SDK pins meta to 1.17.0. With `^`
  # constraints pub picks a *newer* flutter_riverpod that no annotation version
  # can pair with and the resolve fails with a wall of unrelated-looking text.
  # Bump all three lines together or none of them.
  flutter_riverpod: 3.2.1
  riverpod_annotation: 4.0.2

  # HTTP. Chosen over `http` for interceptors: the Bearer header and the app-wide
  # 401 reaction are one interceptor each instead of a wrapper around every call.
  dio: ^5.11.1

  freezed_annotation: ^3.1.0
  # Held below 4.12: json_serializable 6.13.1+ (the first release that wants
  # json_annotation 4.12) switched to a dart_style that needs analyzer >=10,
  # which riverpod_generator 4.0.3 cannot accept. Same lockstep problem as the
  # riverpod block -- the ceiling here exists only to keep the two generators
  # able to share one analyzer.
  json_annotation: ^4.11.0

  # Where the board snapshot file lives (F2). The plan calls for "a JSON
  # snapshot of the board in a file", and a file needs a directory that exists
  # on both targets and is not visible to the user: `getApplicationSupportDirectory`
  # is `/data/data/<pkg>/files` on Android and `%APPDATA%\<app>` on Windows.
  # Deliberately not the documents directory, which Android exposes in the file
  # manager -- a read cache has no business showing up there.
  path_provider: ^2.1.5

  # The one user setting this app has (F4): the hour the morning reminders fire
  # at. Deliberately NOT the board snapshot's file-plus-schema-version machinery
  # -- that exists to make a cache whose every failure mode maps to "there is no
  # cache", and a two-integer preference needs none of it.
  #
  # `shared_preferences` over a hand-rolled JSON file because it is already the
  # platform's own answer on both targets (Android SharedPreferences, a JSON
  # file in the roaming app-data folder on Windows), because a preference has no
  # schema to migrate, and because the next settings (F7's remembered scope,
  # F8's ASR model path) are the same shape and will cost one line each.
  #
  # NOT for the token: that stays in `flutter_secure_storage`. SharedPreferences
  # is world-readable to anything with root or a backup extractor, which is
  # exactly the distinction the two packages exist to keep.
  shared_preferences: ^2.5.2

  # Token storage: Android Keystore / Windows DPAPI rather than SharedPreferences.
  # Pinned to the 10.x line to match the sibling CashFlow app, so the two projects
  # on this machine share one platform-channel implementation and one set of
  # Android/Windows quirks. 11.x exists but diverges from that baseline.
  flutter_secure_storage: ^10.0.0

  # Local notifications (F1). The whole point of the native client: the app
  # schedules its own alarms, no FCM, no server-side cron, no push keys.
  #
  # 22.x is the first line that builds against this SDK (it needs Flutter
  # >=3.38.1 / Dart >=3.10; we are on 3.41.8 / 3.11.5). It also pulls the
  # Windows/Linux/web federated implementations in automatically -- see
  # `lib/notifications/notification_gateway.dart` for what is actually
  # supported on which platform.
  flutter_local_notifications: ^22.3.1

  # `zonedSchedule` takes a `TZDateTime`, not a `DateTime`: the OS needs to be
  # told *which* 09:00 is meant, and a bare local `DateTime` cannot express that
  # across a DST transition. This package is also pure Dart, which is why the
  # fire-time arithmetic in `lib/domain/reminder_schedule.dart` is unit-testable
  # without a device.
  timezone: ^0.11.1

  # Markdown rendering for project notes (F3). `flutter_markdown` is the SDK's
  # own package and is **discontinued**; `flutter_markdown_plus` is the
  # maintained fork of it, which is why the plan names it by name.
  #
  # 1.0.x is what this SDK can take, and it is worth knowing why the answer was
  # not "the newest of the three candidates": the fork's constraints are
  # deliberately loose (`sdk: ^3.4.0`, `meta: ^1.16.0`, `markdown: ^7.3.1`), so
  # it composes with the analyzer/meta ceiling that the two code generators
  # already impose on this project (see the riverpod block above). The other two
  # renderers considered -- `markdown_widget` and `gpt_markdown` -- resolve as
  # well, but each drags in dependencies a note viewer has no use for
  # (`url_launcher` + `visibility_detector` + syntax highlighting, and
  # `flutter_math_fork` respectively).
  #
  # Caret rather than an exact pin: nothing here is in a generator lockstep, so
  # a patch release cannot break the resolve the way a riverpod bump can.
  flutter_markdown_plus: ^1.0.12

  # `timezone` ships the tz database but has no idea which zone the device is
  # in -- without this, `tz.local` stays UTC and every reminder fires at
  # 09:00 UTC, i.e. at the wrong hour everywhere except the UK in winter. That
  # failure is invisible in code review and only shows up as "the notification
  # came at noon". See `NotificationTimeZone` for the fallback when this fails.
  flutter_timezone: ^5.1.0

  # ---- Voice input (F9) ----
  #
  # Dictation into the sandbox, recognised **on the device**. The whole point is
  # that nothing leaves the phone: the system `SpeechRecognizer` (the
  # `speech_to_text` package) needs the network on most Android builds and sends
  # the audio to a server, which is the wrong trade for a tool whose reason to
  # exist is that "надо не забыть" arrives where there is no signal.
  #
  # `sherpa_onnx` is k2-fsa's Flutter binding over onnxruntime. It brings one
  # native package per platform (`sherpa_onnx_android_arm64`,
  # `sherpa_onnx_windows`, ...) automatically, which is the reason it is one line
  # here and 27 MB of native library per ABI in the APK (measured on arm64 in a
  # debug build; armeabi-v7a is 19 MB). The *model* is not in the APK at all --
  # it is downloaded on first use; see `lib/voice/voice_model.dart` for that
  # decision and its numbers.
  sherpa_onnx: ^1.13.8

  # Microphone capture. Used in exactly one mode -- 16 kHz mono WAV into a temp
  # file -- because that is what the recogniser wants and what `readWave` in
  # `sherpa_onnx` reads back. Nothing here streams: a held-button phrase is a few
  # hundred kilobytes, and a file is one less moving part than a byte stream that
  # has to survive a platform channel.
  record: ^6.2.1

  # Unpacking the model archive (`.tar.bz2` from the sherpa-onnx releases).
  # `extractFileToDisk` streams through the file rather than holding the whole
  # 225 MB in memory, which is the difference between working and being killed by
  # the OS on a phone.
  archive: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.4.0
  freezed: ^3.2.0
  json_serializable: '>=6.13.0 <6.13.1'
  # Exact pin -- see the riverpod block in `dependencies` above.
  riverpod_generator: 4.0.3

flutter:
  uses-material-design: true

  # Roboto, bundled rather than downloaded (F10).
  #
  # This exists for the web build and is load-bearing there. CanvasKit has no
  # access to the system's fonts -- it rasterises text itself -- so with no
  # bundled family the engine fetches Roboto from fonts.gstatic.com at run time.
  # Behind the site block's `connect-src 'self'` that fetch is refused, and the
  # result is not a fallback font but **no text at all**: buttons and fields
  # render as empty shapes. Measured exactly that way before these four files
  # were added.
  #
  # The alternative was allowing fonts.gstatic.com in the policy, which would
  # make a self-hosted personal tool phone home to Google on every load and
  # depend on a CDN it does not control. The same reasoning already put CanvasKit
  # itself on our origin (`flutter build web --no-web-resources-cdn`).
  #
  # Android and Windows do not need it -- both have Roboto (or an equivalent)
  # from the system -- and pay ~690 KB for it. That is the cost of `fonts:`
  # being a per-project rather than a per-platform declaration, and it buys one
  # more thing worth having: the three targets now rasterise the same glyphs.
  #
  # The files are copied from the Flutter SDK's own `material_fonts` artifact,
  # which is where the engine would have got them anyway; Roboto is Apache-2.0
  # and the licence travels with them in assets/fonts/Roboto-LICENSE.txt.
  # Weights beyond these four (thin, light, black, condensed) are not declared
  # because the Material text theme never asks for them.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic

    # Golos Text and Unbounded, the two faces of the F12 interface language
    # (`design/three-modes-spec.md`). Both are SIL OFL 1.1 and both carry full
    # Cyrillic, which is the reason they were chosen over anything Material
    # ships with.
    #
    # Bundled for exactly the reason Roboto above is bundled, and more strictly:
    # the spec states it as a requirement -- "не тянуть из сети: приложение
    # обязано открываться без неё". On the web build a font fetched from
    # fonts.gstatic.com is refused by the site policy's `connect-src 'self'`
    # and the result is not a fallback face but *no text at all*.
    #
    # These are the **static instances**, one file per weight, not the variable
    # `GolosText[wght].ttf` that google/fonts publishes upstream. Flutter's
    # `fonts:` block maps a file to a weight, so a single variable file declared
    # four times would render four identical regulars -- the weight axis is not
    # applied by the asset declaration. The statics come from the same place the
    # browser would have got them (the Google Fonts CSS API, `v7`/`v12`), and
    # the licences travel with them in assets/fonts/*-LICENSE.txt.
    #
    # Golos carries 400/500/600/700 because the interface uses all four:
    # body, current task, buttons and chips, headings. Unbounded carries only
    # 600/700 because it is used only for large numbers, mode names and screen
    # titles -- it is ~340 KB per weight, five times Golos, and a weight nothing
    # asks for would be 340 KB of nothing.
    - family: Golos Text
      fonts:
        - asset: assets/fonts/GolosText-Regular.ttf
        - asset: assets/fonts/GolosText-Medium.ttf
          weight: 500
        - asset: assets/fonts/GolosText-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GolosText-Bold.ttf
          weight: 700
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Unbounded-Bold.ttf
          weight: 700
