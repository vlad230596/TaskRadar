<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    Replaced by `flutter build web --base-href`. It stays "/" for this app: the
    bundle is served from the root of its own origin, next to the API prefixes
    (see deploy/Caddyfile.taskradar.example).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="TaskRadar — доска проектов и задач.">

  <!--
    No `robots` meta and no `noindex` here on purpose: the origin answers
    everything behind a login, and the one document it serves is this empty
    shell. Nothing an indexer could reach says anything.
  -->

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TaskRadar">
  <!--
    Square-cornered on purpose: iOS applies its own rounded mask to a
    home-screen icon and paints whatever is transparent behind it black, so the
    rounded tile the browser tab and the manifest use would get black corners
    there. Every icon in this folder is drawn by scripts/generate-app-icons.py.
  -->
  <link rel="apple-touch-icon" href="icons/Icon-apple-180.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TaskRadar</title>
  <link rel="manifest" href="manifest.json">

  <!--
    The loader below, styled inline because it has to paint from this one
    response: no stylesheet, no web font, no script (the site's CSP refuses
    inline scripts anyway). Colours are the app's `AppColors.background`,
    `ink` and `indigo`, so the hand-over to the first Flutter frame does not
    flash.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #F3F3F7; }
    #app-loader {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1B2050;
    }
    #app-loader img { width: 72px; height: 72px; }
    #app-loader .app-loader__title { font-size: 20px; font-weight: 700; }
    #app-loader .app-loader__hint { font-size: 14px; color: #61637E; }
    #app-loader .app-loader__bar {
      width: 160px; height: 4px; border-radius: 2px; overflow: hidden; background: #E6E8F7;
    }
    #app-loader .app-loader__bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 2px;
      background: #4A56BE; animation: app-loader-slide 1.2s ease-in-out infinite;
    }
    @keyframes app-loader-slide {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-loader .app-loader__bar::after { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <!--
    Visible until Flutter's first frame, which removes it (`lib/web/app_loader.dart`).

    Before it existed the body was empty, and the ~14 s it takes a first visit
    to download CanvasKit, `main.dart.js` and the fonts from the VDS was a
    blank white page indistinguishable from a dead site. Pinned by
    test/web_index_test.dart.
  -->
  <div id="app-loader" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div class="app-loader__title">TaskRadar</div>
    <div class="app-loader__bar"></div>
    <div class="app-loader__hint">Загрузка…</div>
  </div>
  <!--
    `flutter_bootstrap.js` is generated by the build and loads the engine, the
    service worker and `main.dart.js`. It is left unconfigured: the defaults
    pick the renderer, and this app has nothing to say about that choice.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
